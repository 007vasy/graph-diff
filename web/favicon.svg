<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0" stop-color="#1c2633"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g stroke="#5b6b80" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="44" x2="32" y2="20"/>
    <line x1="32" y1="20" x2="46" y2="40"/>
    <line x1="20" y1="44" x2="46" y2="40" stroke="#3fb950" stroke-dasharray="4 4"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="32" cy="20" r="8" fill="#e3b341"/>
    <circle cx="20" cy="44" r="7" fill="#3fb950"/>
    <circle cx="46" cy="40" r="6" fill="#f85149"/>
  </g>
</svg>
